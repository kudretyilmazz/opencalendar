# documentation: https://github.com/kudretyilmazz/opencalendar/blob/main/docs/03-architecture/self-hosting.md
# slogan: Open-source scheduling: booking pages, calendar sync and embeds. A Cal.com/Calendly alternative.
# category: productivity
# tags: calendar,scheduling,booking,appointments,calendly,calcom,caldav
# port: 3000
#
# Coolify: New Resource → Docker Compose Empty → paste this file → set the SMTP values → Deploy.
# Secrets and the public URL are generated by Coolify; the first account to sign up becomes the admin.

services:
  opencalendar:
    image: ghcr.io/kudretyilmazz/opencalendar:1.0.0
    environment:
      - SERVICE_URL_OPENCALENDAR_3000
      - APP_URL=${SERVICE_URL_OPENCALENDAR}
      - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-opencalendar}
      - AUTH_SECRET=${SERVICE_BASE64_64_AUTH}
      # Must decode to exactly 32 bytes: REALBASE64 is real base64, BASE64 is only random text.
      - ENCRYPTION_KEY=${SERVICE_REALBASE64_32_ENCRYPTION}
      - WORKER_MODE=external
      - MIGRATE_ON_START=true
      # Email is required (sign-in links and booking confirmations).
      - SMTP_HOST=${SMTP_HOST:?}
      - SMTP_PORT=${SMTP_PORT:?587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM:?}
      # open | invite_only | disabled
      - SIGNUP_MODE=${SIGNUP_MODE:-open}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Optional sign-in providers (hidden unless both values are set)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - EMBED_ALLOWED_ORIGINS=${EMBED_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/ready"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  worker:
    image: ghcr.io/kudretyilmazz/opencalendar:1.0.0
    command: ["node", "worker.js"]
    exclude_from_hc: true
    environment:
      - APP_URL=${SERVICE_URL_OPENCALENDAR}
      - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-opencalendar}
      - AUTH_SECRET=${SERVICE_BASE64_64_AUTH}
      - ENCRYPTION_KEY=${SERVICE_REALBASE64_32_ENCRYPTION}
      - SMTP_HOST=${SMTP_HOST:?}
      - SMTP_PORT=${SMTP_PORT:?587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM:?}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      opencalendar:
        condition: service_healthy # the web container applies migrations first

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-opencalendar}
    volumes:
      - opencalendar-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10
