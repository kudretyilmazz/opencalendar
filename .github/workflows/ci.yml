name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs the full suite before publishing a tagged version.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  static:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Dependency audit (fails on high/critical, production deps)
        run: npm audit --omit=dev --audit-level=high

  unit:
    name: Unit (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: [UTC, America/New_York]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: Integration + coverage (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # Testcontainers starts postgres:16-alpine through the runner's Docker daemon.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: coverage, path: coverage, if-no-files-found: ignore }

  e2e:
    name: E2E (production build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: opencal, POSTGRES_PASSWORD: opencal, POSTGRES_DB: opencal }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U opencal" --health-interval 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://opencal:opencal@localhost:5432/opencal
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-auth-secret-not-for-production-000
      ENCRYPTION_KEY: "wf4VEfVRw5jOoe4gJWTyJ27alTQsUbsJRnZrH1Vwqqc=" # CI-only, not a secret
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: OpenCalendar <no-reply@localhost>
      WORKER_MODE: inline
      E2E_BASE_URL: http://localhost:3000
      ALLOW_PRIVATE_NETWORK_INTEGRATIONS: "true"
      METRICS_TOKEN: ci-metrics-token-0123456789
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Start Radicale (CalDAV test server)
        run: |
          docker run -d --name radicale -p 5232:5232 \
            -v "$PWD/dev/radicale/config:/config/config:ro" -v "$PWD/dev/radicale/users:/config/users:ro" \
            tomsquest/docker-radicale:latest
          for _ in $(seq 1 30); do curl -fs -o /dev/null http://localhost:5232/.web/ && break; sleep 1; done
      - run: npm run build
      - name: Start production server
        run: |
          cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
          cp -r db .next/standalone/
          (cd .next/standalone && node server.js > ../../server.log 2>&1 &)
          for _ in $(seq 1 60); do curl -fs http://localhost:3000/api/health/ready && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: npm run test:e2e
      - if: failure()
        run: cat server.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: { name: playwright-report, path: playwright-report }

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [static, unit, integration, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Image name (GHCR requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Scan first, publish after: a vulnerable image is never pushed.
      - name: Build for scanning (amd64, local)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: opencalendar:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (fails on high/critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opencalendar:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Build (PRs) / build and publish multi-arch (main)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # `latest` and version tags are published only by release.yml.
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
