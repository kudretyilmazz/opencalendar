name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs the full suite before publishing a tagged version.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  static:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Dependency audit (fails on high/critical, production deps)
        run: npm audit --omit=dev --audit-level=high

  unit:
    name: Unit (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: [UTC, America/New_York]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: Integration + coverage (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # Testcontainers starts postgres:16-alpine through the runner's Docker daemon.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: coverage, path: coverage, if-no-files-found: ignore }

  e2e:
    name: E2E (production build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: opencal, POSTGRES_PASSWORD: opencal, POSTGRES_DB: opencal }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U opencal" --health-interval 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://opencal:opencal@localhost:5432/opencal
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-auth-secret-not-for-production-000
      ENCRYPTION_KEY: "wf4VEfVRw5jOoe4gJWTyJ27alTQsUbsJRnZrH1Vwqqc=" # CI-only, not a secret
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: OpenCalendar <no-reply@localhost>
      WORKER_MODE: inline
      E2E_BASE_URL: http://localhost:3000
      ALLOW_PRIVATE_NETWORK_INTEGRATIONS: "true"
      METRICS_TOKEN: ci-metrics-token-0123456789
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Start Radicale (CalDAV test server)
        run: |
          docker run -d --name radicale -p 5232:5232 \
            -v "$PWD/dev/radicale/config:/config/config:ro" -v "$PWD/dev/radicale/users:/config/users:ro" \
            tomsquest/docker-radicale:latest
          for _ in $(seq 1 30); do curl -fs -o /dev/null http://localhost:5232/.web/ && break; sleep 1; done
      - run: npm run build
      - name: Start production server
        run: |
          cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
          cp -r db .next/standalone/
          (cd .next/standalone && node server.js > ../../server.log 2>&1 &)
          for _ in $(seq 1 60); do curl -fs http://localhost:3000/api/health/ready && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: npm run test:e2e
      - if: failure()
        run: cat server.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with: { name: playwright-report, path: playwright-report }

  # One native runner per architecture (arm64 under QEMU crashed in `npm ci` and hung). On main,
  # each leg pushes an untagged image by digest and `docker-manifest` tags :main and :sha-<sha>.
  docker:
    name: Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: [static, unit, integration, e2e]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, arch: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Image name (GHCR requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Scan first, publish after: a vulnerable image is never tagged.
      - name: Build for scanning (local)
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: opencalendar:scan
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Scan image (fails on high/critical)
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opencalendar:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Build (PRs) / push by digest (main)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # `latest` and version tags are published only by release.yml.
  docker-manifest:
    name: Docker image (publish main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag :main and :sha-<sha>
        working-directory: /tmp/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "$image:main" -t "$image:sha-$GITHUB_SHA" $(printf "$image@sha256:%s " *)
